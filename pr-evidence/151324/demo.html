<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenClaw PR #151324 Evidence</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#181a20;--panel2:#20232b;--muted:#9298a7;--text:#f4f5f7;--accent:#ff5a36;--green:#70d6a2;--warn:#ffbd69;--line:#30333d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0f1013,#191b22);font:15px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}.shell{width:920px;margin:38px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0008;overflow:hidden}.top{padding:20px 26px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:750;font-size:19px;letter-spacing:.2px}.brand span{color:var(--accent)}.badge{font-size:12px;padding:6px 10px;border:1px solid #4b4f5a;border-radius:999px;color:#cbd0db}.content{padding:24px 28px 34px}.evidence{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:18px}.thread{display:flex;flex-direction:column;gap:17px}.msg{max-width:77%;padding:14px 17px;border-radius:14px;line-height:1.48}.user{align-self:flex-end;background:#2c3545;border-bottom-right-radius:4px}.assistant{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}.label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:7px}.narration{border-left:3px solid var(--warn);color:#ffdca9}.final{border-left:3px solid var(--green)}.progress{display:flex;align-items:center;gap:10px;color:#b9c0cc;font-size:14px;padding:10px 14px;border:1px solid #39404a;border-radius:10px;background:#15181e}.dot{width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 0 4px #70d6a222}.note{margin-top:22px;padding:12px 14px;border-radius:10px;background:#121419;color:var(--muted);font-size:12px;border:1px dashed #3d414b}.ok{color:var(--green)}.bad{color:var(--warn)}code{color:#e4b9ff} .footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font- </style></head><body><main class="shell"><header class="top"><div class="brand"><span>◈</span> OpenClaw <small style="color:var(--muted);font-weight:500">Control UI</small></div><div class="badge" id="status">PR #151324</div></header><section class="content"><div class="evidence" id="title"></div><div class="thread"><div class="msg user"><div class="label">You</div>Use the lookup tool to find the capital of France, then answer briefly.</div><div id="conversation"></div></div><div class="note" id="note"></div><div class="footer"><span>MiniMax-M3 · <code>api.minimaxi.com</code></span><span>redacted evidence</span></div></section></main>
<script>
const mode=new URLSearchParams(location.search).get('mode')||'after';const c=document.querySelector('#conversation'),t=document.querySelector('#title'),n=document.querySelector('#note');
const progress='<div class="progress"><span class="dot"></span><span>Using lookup tool · progress retained</span></div>';
const final='<div class="msg assistant final"><div class="label">Assistant · final</div>The capital of France is <b>Paris</b>.</div>';
if(mode==='before'){t.textContent='Before fix · visible pre-tool narration';c.innerHTML='<div class="msg assistant narration"><div class="label">Assistant · leaked text</div>I\'ll look up the capital of France for you.</div><div class="progress"><span class="dot" style="background:var(--warn)"></span><span>Calling lookup tool…</span></div>';n.innerHTML='<span class="bad">Bug pattern:</span> ordinary text emitted before <code>tool_use</code> is rendered as the assistant reply.'}
else if(mode==='progress'){t.textContent='After fix · reload / retained progress';c.innerHTML=progress+final;n.innerHTML='<span class="ok">Expected:</span> legitimate tool progress remains visible after reload; pre-tool narration is not shown.'}
else{t.textContent='After fix · commentary hidden';c.innerHTML=progress+final;n.innerHTML='<span class="ok">Fixed:</span> only legitimate progress and the final answer are visible; commentary text is suppressed.'}
</script></body></html>
